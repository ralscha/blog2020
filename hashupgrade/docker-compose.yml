services:
  db:
    image: mariadb:13.0.2
    ports:
      - "3366:3306"
    restart: "no"
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: demo
      MARIADB_USER: demo
      MARIADB_PASSWORD: demo

volumes:
  mariadb-data:
